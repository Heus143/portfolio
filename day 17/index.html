<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice Day 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<main class="container-fluid">

    <nav class="row bg-dark" style="height:80px;">
        <div class="col d-flex justify-content-center align-items-center">
            <h2 class="text-white">Bootstrap Carousel Practice</h2>
        </div>
    </nav>

    <article class="row justify-content-center bg-light p-5">

        <div class="col-8">

            <div id="slider" class="carousel slide">

                <div class="carousel-indicators">

                    <button type="button" data-bs-target="#slider" data-bs-slide-to="0" class="active"></button>

                    <button type="button" data-bs-target="#slider" data-bs-slide-to="1"></button>

                    <button type="button" data-bs-target="#slider" data-bs-slide-to="2"></button>

                </div>

                <div class="carousel-inner">

                    <div class="carousel-item active">
                        <img src="https://picsum.photos/id/1015/900/400" class="d-block w-100" alt="">
                    </div>

                    <div class="carousel-item">
                        <img src="https://picsum.photos/id/1016/900/400" class="d-block w-100" alt="">
                    </div>

                    <div class="carousel-item">
                        <img src="https://picsum.photos/id/1018/900/400" class="d-block w-100" alt="">
                    </div>

                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#slider" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                    <span class="visually-hidden">Previous</span>
                </button>

                <button class="carousel-control-next" type="button" data-bs-target="#slider" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                    <span class="visually-hidden">Next</span>
                </button>

            </div>

        </div>

    </article>

    <article class="row justify-content-center bg-secondary p-4">

        <div class="col-8 text-center">

            <h3 class="text-white">Close Button</h3>

            <button class="btn-close bg-white"></button>

        </div>

    </article>

    <article class="row justify-content-center bg-light p-5">

        <div class="col-6">

            <h3 class="mb-4">Login Form</h3>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter Password">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="check1">
                <label class="form-check-label" for="check1">Remember Me</label>
            </div>

            <button class="btn btn-primary">Login</button>

        </div>

    </article>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
