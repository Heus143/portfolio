<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<main class="container-fluid">

    <nav class="row" style="height:90px;">
        <div class="col bg-dark"></div>
        <div class="col bg-success"></div>
        <div class="col bg-danger"></div>
        <div class="col bg-warning"></div>
        <div class="col bg-primary"></div>
        <div class="col bg-secondary"></div>
        <div class="col bg-light"></div>
        <div class="col bg-success"></div>
        <div class="col bg-danger"></div>
        <div class="col bg-warning"></div>
        <div class="col bg-secondary"></div>
        <div class="col bg-dark"></div>
    </nav>

    <article class="row justify-content-center align-items-center bg-success" style="height:50vh;">
        <div class="col-6 text-center">
            <h1 class="display-1 text-white">Display-1</h1>
            <p class="display-6 text-warning">Bootstrap Typography</p>
        </div>
    </article>

    <article class="row justify-content-center align-items-center bg-danger" style="height:40vh;">
        <div class="col-8 text-center">
            <h2 class="display-2 text-light">Display-2</h2>
        </div>
    </article>

    <article class="row justify-content-center align-items-center bg-dark" style="height:80vh;">
        <div class="col-4 bg-primary text-center">
            <h3 class="display-3 text-white">Display-3</h3>
        </div>

        <div class="col-4 bg-warning text-center">
            <h3 class="display-4">Display-4</h3>
        </div>
    </article>

    <article class="row justify-content-evenly align-items-center bg-primary" style="height:80vh;">
        <div class="col-3 bg-light p-5 text-center">
            <h4 class="display-5">Display-5</h4>
        </div>

        <div class="col-3 bg-info p-5 text-center">
            <h4 class="display-6">Display-6</h4>
        </div>

        <div class="col-3 bg-success p-5 text-center">
            <p class="lead">Lead Text</p>
        </div>
    </article>

    <article class="row justify-content-center align-items-center bg-info" style="height:40vh;">
        <div class="col-6 text-center">
            <h2 class="display-4">Article 5</h2>
        </div>
    </article>

    <article class="row justify-content-center align-items-center bg-warning" style="height:40vh;">
        <div class="col-6 text-center">
            <h2 class="display-5">Article 6</h2>
        </div>
    </article>

    <footer class="row justify-content-center align-items-center bg-secondary" style="height:90px;">
        <div class="col text-center">
            <h5 class="text-white">Footer</h5>
        </div>
    </footer>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
